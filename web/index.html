<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Europeciv: Europe as a strategy game</title>
  <meta name="description" content="Real Europe drawn like a 4X strategy map: hex terrain, cities with yields, lenses and resources, all from public data.">
  <meta name="theme-color" content="#131e2a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23120d06'/%3E%3Ccircle cx='32' cy='32' r='29' fill='%23c9a45c'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%232a4d8f'/%3E%3Cpath fill='%23f8f0d8' d='M32 14l4.9 11.3 12.2 1.1-9.3 8.1 2.8 12-10.6-6.4-10.6 6.4 2.8-12-9.3-8.1 12.2-1.1z'/%3E%3C/svg%3E">
  <!-- Social cards. Crawlers need absolute URLs: if you host your own copy, change https://mathieuastruc.com/europeciv/
       to its address (og:url, og:image, twitter:image, canonical) and SITE_URL in js/app/share.js. -->
  <link rel="canonical" href="https://mathieuastruc.com/europeciv/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Europeciv">
  <meta property="og:title" content="Europe as a strategy-game map">
  <meta property="og:description" content="The real European economy drawn like a 4X strategy map: hex terrain, cities with yields, lenses and resources, all from public data (Eurostat, GISCO, NOAA, Natural Earth, GeoNames).">
  <meta property="og:url" content="https://mathieuastruc.com/europeciv/">
  <meta property="og:image" content="https://mathieuastruc.com/europeciv/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Hex map of Europe with city banners, in the style of a strategy game">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Europe as a strategy-game map">
  <meta name="twitter:description" content="The real European economy drawn like a 4X strategy map, from public data.">
  <meta name="twitter:image" content="https://mathieuastruc.com/europeciv/og-image.png">
  <meta name="twitter:image:alt" content="Hex map of Europe with city banners, in the style of a strategy game">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="Europe"><span class="brand-emblem" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 1.8L20.8 6.9V17.1L12 22.2L3.2 17.1V6.9Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 6.4L16.8 9.2V14.8L12 17.6L7.2 14.8V9.2Z" fill="currentColor" opacity=".55"/></svg></span><span class="brand-text">Europe</span></div>
    <div id="yields" class="yields" aria-label="European yields"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Search places, cities &amp; countries" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Search places, cities and countries (/ or Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <button type="button" class="icon-btn search-close" aria-label="Close search"></button>
    </div>
    <div id="turn" class="turn"></div>
    <button id="btn-menu" class="btn btn-icon tb-menu-btn" type="button" aria-label="Menu: Advisors, Rankings, Daily challenge, Share, Help, Almanac"
      aria-haspopup="true" aria-expanded="false" aria-controls="tb-buttons"></button>
    <div class="tb-buttons" id="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Share this view" title="Share: copy a link or download an image"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Keyboard and mouse help" title="Help (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Open the Almanac" title="What every number means and where it comes from"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="Hex map of Europe"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Details"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Choose a lens"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Lens legend"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Map lenses">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Resources on tiles (R)" title="Show or hide resources on tiles (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Minimap: click to jump" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Show the minimap"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Search results" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Share" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="European report" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Almanac">
      <button class="close icon-btn" data-close aria-label="Close the Almanac"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 5.5L18.5 18.5M18.5 5.5L5.5 18.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
      <nav id="pedia-nav" aria-label="Almanac pages"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">Surveying the land…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
